name: Event check

# Olive Young Global sales/events seen on the live site (home banners + event page), rendered in Chromium.
# Read-only research: nothing is published. Results go to the `events` branch (<date>/), never to main.
on:
  schedule:
    - cron: "17 22 * * *"   # 07:17 KST daily, before the 08:47 daily run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          python tools/events.py out/ev 2>&1 | tee /tmp/run.log
      - name: Save to the events branch
        if: always()
        run: |
          DAY=$(TZ=Asia/Seoul date +%F)
          git config user.name "kbeautysave-bot"
          git config user.email "kbeautysave-bot@users.noreply.github.com"
          if git fetch -q --depth 1 origin events; then
            git worktree add -q ../ev FETCH_HEAD
          else
            git worktree add -q --orphan -b events ../ev
          fi
          mkdir -p "../ev/$DAY"
          cp out/ev/* "../ev/$DAY/" 2>/dev/null || true
          cp /tmp/run.log "../ev/$DAY/run.log" 2>/dev/null || true
          cd ../ev
          git add -A
          git diff --cached --quiet || git commit -q -m "Event check $DAY (run ${{ github.run_id }})"
          git push -q origin HEAD:events
